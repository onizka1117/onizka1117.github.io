<script>

const getEventTagHtml = function(eventType, num){ //type1 시공 |  type2 배송 | type3 실측 | type4 미팅 | type5 기타
    const newDiv = document.createElement('div');
    if(eventType === "시공") {
        newDiv.className = "event-type1";
        newDiv.innerHTML = "<span>시공</span><em>"+num+"</em>";
    }else if (eventType === "배송") {
        newDiv.className = "event-type2";
        newDiv.innerHTML = "<span>배송</span><em>"+num+"</em>";
    }else if (eventType === "실측") {
        newDiv.className = "event-type3";
        newDiv.innerHTML = "<span>실측</span><em>"+num+"</em>";
    }else if (eventType === "미팅") {
        newDiv.className = "event-type4";
        newDiv.innerHTML = "<span>미팅</span><em>"+num+"</em>";
    }else {
        newDiv.className = "event-type5";
        newDiv.innerHTML = "<span>기타</span><em>"+num+"</em>";
    }
    return newDiv;
}

var calendarEl = document.getElementById('calendar');
var calendar = new FullCalendar.Calendar(calendarEl, {
    locale: 'ko', // 한글 설정
    firstDay: 1,
    headerToolbar: false,
    editable: true,
    height: 'auto',
    dayMaxEvents: false, // allow "more" link when too many events
    // 날짜 셀에 숫자만 표시
    dayCellContent: function (arg) {
    return arg.date.getDate(); // 숫자만 반환
},
dateClick: function(info) {
    console.log('클릭한 날짜: ' + info.dateStr);
},
events: [
],
dayCellDidMount: function(info) {
    const dateStr = info.date.toLocaleDateString('ko-KR'); // 로컬 시간대 기준 날짜 문자열

    if (dateStr === '2025. 4. 3.') { 
        const customHtml = document.createElement('div');
        customHtml.className = 'custom-box';        
        customHtml.appendChild(getEventTagHtml("시공", 3));
        info.el.appendChild(customHtml);
    }
    if (dateStr === '2025. 4. 5.') { 
        const customHtml = document.createElement('div');
        customHtml.className = 'custom-box';        
        customHtml.appendChild(getEventTagHtml("배송", 11));
        customHtml.appendChild(getEventTagHtml("시공", 3));
        info.el.appendChild(customHtml);
    }
    if (dateStr === '2025. 4. 11.') { 
        const customHtml = document.createElement('div');
        customHtml.className = 'custom-box';        
        customHtml.appendChild(getEventTagHtml("실측", 2));
        customHtml.appendChild(getEventTagHtml("시공", 3));
        info.el.appendChild(customHtml);
    }
    if (dateStr === '2025. 4. 21.') { 
        const customHtml = document.createElement('div');
        customHtml.className = 'custom-box';        
        customHtml.appendChild(getEventTagHtml("미팅", 2));
        customHtml.appendChild(getEventTagHtml("시공", 3));
        info.el.appendChild(customHtml);
    }
    if (dateStr === '2025. 4. 26.') { 
        const customHtml = document.createElement('div');
        customHtml.className = 'custom-box';        
        customHtml.appendChild(getEventTagHtml("기타", 5));
        info.el.appendChild(customHtml);
    }
}

});

calendar.render();


function goDate(month) {
    calendar.gotoDate(month);
}

document.addEventListener('DOMContentLoaded', function() { 
    
});
</script>

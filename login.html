<!DOCTYPE html>
<html>
<head>
<title>로그인</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="style/common.css">
<script type="text/javascript" src="js/jquery-3.7.1.js"></script>
<script type="text/javascript" src="js/common.js"></script>
</head>
<body>


<div class="login-wrap">

    <div class="login-header">
         <ul>
            <li class="setting"> 
                <button class="btn-setting" aria-label="설정"></button>
            </li>
            <li>
                <button class="btn-mini" aria-label="최소화"></button>
            </li>
            <li>
                <button class="btn-closed" aria-label="최소화"></button>
            </li>
         </ul>
    </div> 

    <div class="login-form">
        <div class="inner">
            <div class="login-form-top">
                <h1>Log In</h1>
                <p class="sub-tit">Get started for you business</p>
            </div>
            <div class="login-center">
                <p class="txt">인증키 입력  ( 12자리 )  인증키 관련 문의는 판매사에 문의하세요</p>
                <input type="text" placeholder="SN" />
    
                <div class="login-input-group">
                    <input type="text" placeholder="ID" />
                    <input type="text" placeholder="PW" />
                </div>
    
                <div class="flex-box login-option">
                    <label class="checkbox" for="checkbox01">
                        <input type="checkbox" id="checkbox01" />
                        <span class="ico" aria-hidden="true"></span>
                        <span class="lbl">자동로그인</span>
                    </label>
    
                    <button type="button" class="btn-tooltip" aria-label="안내"></button>
                </div>
    
                <button class="btn btn-normal full">로그인</button>
            </div> 
        </div>
        
        
    </div>

    <div class="footer">
        <span>Contact US</span>
        <span class="mail">inkopark1@naver.com</span>
    </div>

</div>


</body>
</html>
